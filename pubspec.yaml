name: better_muslim
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.7.0
  cupertino_ui: ^1.1.3
  adhan_alarms:
    path: packages/adhan_alarms
  prayer_surfaces:
    path: packages/prayer_surfaces
  adhan_dart: ^2.0.1
  animations: ^3.0.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.1
  go_router: ^18.1.0
  hijri: ^3.0.1
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  sentry_flutter: ^10.1.0
  timezone: ^0.11.2
  workmanager: ^0.10.10
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  build_runner: any
  drift_dev: any
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# sqlite3 builds SQLite3MultipleCiphers, so the drift store can be encrypted with pragma key
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  shaders:
    - shaders/liquid_glass.frag
    - shaders/page_curl.frag

  assets:
    - assets/icons/outline/
    - assets/icons/filled/
    - assets/icons/ui/
    - assets/brand/
    - assets/ornaments/
    - assets/l10n/
    - assets/places/
    - assets/azkar/
    - assets/duas/
    - assets/quran/
    - assets/quran/pages/
    - assets/quran/pages_v1/
    - assets/quran/surahs/
    - assets/quran/translations/
    - assets/audio/
    - shorebird.yaml

  fonts:
    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Variable.ttf
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Variable.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: KfgqpcHafs
      fonts:
        - asset: assets/fonts/KfgqpcHafs.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf

flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path_ios: assets/app_icon/png/ios_light.png
  image_path_ios_dark_transparent: assets/app_icon/png/ios_dark.png
  image_path_ios_tinted_grayscale: assets/app_icon/png/ios_tinted.png
  adaptive_icon_background: assets/app_icon/png/android_background.png
  adaptive_icon_foreground: assets/app_icon/png/android_foreground.png
  adaptive_icon_monochrome: assets/app_icon/png/android_monochrome.png
  image_path_android: assets/app_icon/png/play_store_512.png
