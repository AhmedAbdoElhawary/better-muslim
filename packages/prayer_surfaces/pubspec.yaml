name: prayer_surfaces
description: "The widgets' data, the Live Activity and the Android countdown, in every engine."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.14.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

# a plugin, so its channel exists in every engine: the app's, workmanager's and mark prayed's
flutter:
  plugin:
    platforms:
      android:
        package: com.elhawary.bettermuslim.surfaces
        pluginClass: PrayerSurfacesPlugin
      ios:
        pluginClass: PrayerSurfacesPlugin
