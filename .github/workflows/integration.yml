name: Integration

# The on-device journeys in integration_test/, on an Android emulator.
# ci.yml calls this for PRs into staging and production. It can also be run by hand on any branch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys:
    name: Integration Journeys
    runs-on: ubuntu-latest
    # a hung journey once held the runner for 4 hours, a full run takes about 50 minutes
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # booting an emulator for nothing costs minutes, so stop early until the first journey exists
      - name: Find journeys
        id: find
        run: |
          if ls integration_test/*_test.dart >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no integration_test/*_test.dart yet, nothing to run"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # the emulator image, ndk and build together fill the runner disk
      - name: Free disk space
        if: steps.find.outputs.found == 'true'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft

      - uses: actions/setup-java@v6
        if: steps.find.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        if: steps.find.outputs.found == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Get dependencies
        if: steps.find.outputs.found == 'true'
        run: flutter pub get

      # a private repo runner has ~7G, an idle gradle daemon next to the emulator got it killed
      # swap on /mnt, the root disk has no room left for it
      - name: Smaller Gradle heap and swap
        if: steps.find.outputs.found == 'true'
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
            echo "org.gradle.daemon=false"
            echo "kotlin.compiler.execution.strategy=in-process"
          } >> ~/.gradle/gradle.properties
          sudo fallocate -l 8G /mnt/swapfile2
          sudo chmod 600 /mnt/swapfile2
          sudo mkswap /mnt/swapfile2
          sudo swapon /mnt/swapfile2
          free -h && df -h / /mnt

      # the first build fetches the ndk for 11 minutes, more than a journey's 6 minute cap
      - name: Build once
        if: steps.find.outputs.found == 'true'
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define-from-file=dart_define/dev.json

      # without this the emulator falls back to software and is too slow to boot
      - name: Enable KVM
        if: steps.find.outputs.found == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run journeys
        if: steps.find.outputs.found == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          ram-size: 2048M
          cores: 2
          script: tool/integration_test.sh
