name: Deploy

# A version tag -> build that flavor's release -> upload it to Firebase App Distribution.
# Nobody creates these tags by hand; release-on-merge.yml creates one after a PR merges and calls this.
#
#   v1.3.0-dev.2   -> flavor dev        -> DEV_* secrets
#   v1.3.0-stag.1  -> flavor staging    -> STAGING_* secrets
#   v1.3.0         -> flavor production -> PROD_* secrets, Shorebird, Sentry symbols, GitHub Release
#
# per-flavor values are repo secrets with a prefix, one list instead of three environments. The full secret and variable list is in .github/RELEASES.md.
#
# Production is built through `shorebird release` so patch.yml can hotfix it later. A plain
# `flutter build` artifact can never receive a patch, so production must stay on Shorebird.

on:
  workflow_call:
    inputs:
      tag:
        description: The version tag to build and ship.
        required: true
        type: string
  # break-glass only. the pre-push hook blocks hand tags locally, the guard job still refuses a tag that is not on its branch
  push:
    tags:
      - "v*"

permissions:
  contents: write # the release job creates a GitHub Release

concurrency:
  group: deploy-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.map.outputs.tag }}
      prefix: ${{ steps.map.outputs.prefix }}
      flavor: ${{ steps.map.outputs.flavor }}
      target: ${{ steps.map.outputs.target }}
      dart_define: ${{ steps.map.outputs.dart_define }}
      branch: ${{ steps.map.outputs.branch }}
      version: ${{ steps.map.outputs.version }}
      is_production: ${{ steps.map.outputs.is_production }}
    steps:
      - id: map
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v*-dev.*)
              prefix=DEV;     flavor=dev;        target=lib/main_dev.dart;     define=dart_define/dev.json;     branch=develop;    prod=false ;;
            v*-stag.*)
              prefix=STAGING; flavor=staging;    target=lib/main_staging.dart; define=dart_define/staging.json; branch=staging;    prod=false ;;
            v[0-9]*)
              prefix=PROD;    flavor=production; target=lib/main_prod.dart;    define=dart_define/prod.json;    branch=production; prod=true ;;
            *)
              echo "::error::deploy.yml does not recognize tag '$tag' — expected v<x.y.z>-dev.<n>, v<x.y.z>-stag.<n>, or v<x.y.z>"; exit 1 ;;
          esac
          # v1.3.0-dev.2 -> 1.3.0, used as --build-name
          version="${tag#v}"
          version="${version%%-*}"
          {
            echo "tag=$tag"
            echo "prefix=$prefix"
            echo "flavor=$flavor"
            echo "target=$target"
            echo "dart_define=$define"
            echo "branch=$branch"
            echo "version=$version"
            echo "is_production=$prod"
          } >> "$GITHUB_OUTPUT"

  guard:
    name: Verify tag is on its branch
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Confirm the tagged commit is reachable from ${{ needs.resolve.outputs.branch }}
        run: |
          branch="${{ needs.resolve.outputs.branch }}"
          tag="${{ needs.resolve.outputs.tag }}"
          if ! git merge-base --is-ancestor "$tag" "origin/$branch"; then
            echo "::error::tag '$tag' is not on branch '$branch' — refusing to ship a mismatched tag/branch pair"
            exit 1
          fi

  # a called deploy already passed ci-ok, only a break-glass tag skipped it
  verify:
    name: Analyze & test
    if: github.event_name == 'push'
    needs: [resolve, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define-from-file=${{ needs.resolve.outputs.dart_define }}

  android:
    name: Build & distribute (Android)
    needs: [resolve, guard, verify]
    # a skipped need skips this job too unless the condition says otherwise
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLAVOR: ${{ needs.resolve.outputs.flavor }}
      TARGET: ${{ needs.resolve.outputs.target }}
      DART_DEFINE: ${{ needs.resolve.outputs.dart_define }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0 # the auto release notes need the full tag history

      # the runner disk filled up while saving the cache. these are big and the build never uses them
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # the 8g heap in android/gradle.properties got the build killed on a runner once
      - name: Fit Gradle in the runner's memory
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' 'kotlin.daemon.jvmargs=-Xmx2g' 'org.gradle.workers.max=2' > ~/.gradle/gradle.properties

      # the image has neither, downloading them took 5 min of every build. the ndk is flutter 3.50.0's
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-28.2.13676358-cmake-3.22.1

      # dev and staging ship often enough that a new tag is the simpler fix,
      # and keeping code push to one flavor saves the free patch-install allowance
      - name: Setup Shorebird
        if: needs.resolve.outputs.is_production == 'true'
        uses: shorebirdtech/setup-shorebird@8b1059ddb56a926f0146edf4133cc647775c162f # v1.4.1
        with:
          cache: true

      - run: flutter pub get

      # the DSN is never committed, it goes into the git-ignored *.secret.json and is scrubbed below.
      # a DSN is only a client key, but leaking it lets a stranger burn the free event quota.
      # SENTRY_RELEASE too, a background engine has no other way to know its version.
      - name: Write Sentry DSN for this flavor
        env:
          SENTRY_DSN: ${{ secrets[format('{0}_SENTRY_DSN', needs.resolve.outputs.prefix)] }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::warning::${{ needs.resolve.outputs.prefix }}_SENTRY_DSN is not set — this build will ship with crash reporting disabled"
            printf '{}\n' > "dart_define/${FLAVOR}.secret.json"
          else
            python3 -c 'import json,os,sys; json.dump({"SENTRY_DSN": os.environ["SENTRY_DSN"], "SENTRY_RELEASE": "better-muslim@" + os.environ["VERSION"]}, open(sys.argv[1],"w"))' "dart_define/${FLAVOR}.secret.json"
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/android/app/release.jks"
          # printf per line so a password containing $, backticks, etc. is written literally
          {
            printf 'storeFile=%s\n' "${GITHUB_WORKSPACE}/android/app/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "${GITHUB_WORKSPACE}/android/key.properties"

      - name: Build release notes
        run: |
          # the build number on the App Distribution card counts runs, not tags, so name the tag
          printf '%s\n\n' "${{ needs.resolve.outputs.tag }}" > release-notes.txt
          if [ "${{ needs.resolve.outputs.is_production }}" = "true" ]; then
            # production: the CHANGELOG.md entry approved in the promote flow
            python3 tool/changelog_release_notes.py >> release-notes.txt
          else
            # dev/staging: commits since the previous tag in the same stage
            python3 tool/changelog_release_notes.py --auto-since-previous-tag "${{ needs.resolve.outputs.tag }}" >> release-notes.txt
          fi
          echo "----- release notes -----"; cat release-notes.txt

      # Play only takes an AAB for new apps. --obfuscate --split-debug-info strips the Dart symbols
      # out of the binary into build/symbols, uploaded to Sentry below.
      # --flutter-version is pinned because shorebird ignores setup-flutter and would build with
      # the latest stable, a Flutter the verify job never tested. keep it equal to the one above.
      - name: Build release bundle (Shorebird — production)
        if: needs.resolve.outputs.is_production == 'true'
        run: |
          shorebird release android \
            --artifact aab \
            --flavor "$FLAVOR" \
            --flutter-version 3.50.0 \
            -t "$TARGET" \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}" \
            --no-confirm \
            -- \
            --dart-define-from-file="$DART_DEFINE" \
            --dart-define-from-file="dart_define/${FLAVOR}.secret.json" \
            --obfuscate \
            --split-debug-info=build/symbols
          echo "ARTIFACT=build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab" >> "$GITHUB_ENV"

      # App Distribution installs a file straight onto a tester's phone, so it has to be an APK
      - name: Build release APK (dev / staging)
        if: needs.resolve.outputs.is_production != 'true'
        run: |
          flutter build apk --release \
            --flavor "$FLAVOR" \
            -t "$TARGET" \
            --dart-define-from-file="$DART_DEFINE" \
            --dart-define-from-file="dart_define/${FLAVOR}.secret.json" \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}"
          echo "ARTIFACT=build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk" >> "$GITHUB_ENV"

      - name: Verify the artifact is signed with the release key (not debug)
        run: |
          test -f "$ARTIFACT" || { echo "::error::expected artifact not found at $ARTIFACT"; exit 1; }
          case "$ARTIFACT" in
            *.aab)
              # an AAB carries a JAR signature, which apksigner does not read
              certs="$(jarsigner -verify -verbose:summary -certs "$ARTIFACT" 2>&1)"
              ;;
            *)
              # AGP signs APKs v2/v3 only, no JAR signature
              apksigner="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
              if [ -z "$apksigner" ]; then echo "::warning::apksigner not found — skipping signature check"; exit 0; fi
              certs="$("$apksigner" verify --print-certs "$ARTIFACT")"
              ;;
          esac
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::artifact is debug-signed — check the ANDROID_KEYSTORE_* secrets"; exit 1
          fi

      # without these symbols every production stack trace is bare hex addresses.
      # it fails the release on purpose, a production build whose crashes can't be read is not worth shipping.
      #   SENTRY_AUTH_TOKEN  secret. an ORGANIZATION token (sntrys_...) carries its own org, so SENTRY_ORG can stay empty
      #   SENTRY_PROJECT     variable, the slug of the project behind PROD_SENTRY_DSN
      #   SENTRY_URL         variable, must match the org's data region or a valid token is rejected
      - name: Upload debug symbols to Sentry
        if: needs.resolve.outputs.is_production == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # a slug is not a secret, but vars and secrets are separate namespaces, so accept both
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || secrets.SENTRY_URL || 'https://de.sentry.io/' }}
        run: |
          missing=""
          [ -n "$SENTRY_AUTH_TOKEN" ] || missing="$missing SENTRY_AUTH_TOKEN"
          [ -n "$SENTRY_PROJECT" ]    || missing="$missing SENTRY_PROJECT"
          if [ -n "$missing" ]; then
            echo "::error::cannot symbolicate production crashes — not set:$missing. See .github/RELEASES.md."
            exit 1
          fi
          # only an organization token knows its own org
          case "$SENTRY_AUTH_TOKEN" in
            sntrys_*) ;;
            *) [ -n "$SENTRY_ORG" ] || {
                 echo "::error::SENTRY_AUTH_TOKEN is not an organization token (sntrys_...), so SENTRY_ORG must be set."
                 exit 1
               } ;;
          esac
          test -d build/symbols || { echo "::error::build/symbols is missing — did the release step keep --split-debug-info?"; exit 1; }
          # pinned and checksummed, not `curl | bash`: the release keystore is on disk in this job
          curl -sSfL -o "$RUNNER_TEMP/sentry-cli" \
            https://github.com/getsentry/sentry-cli/releases/download/3.8.0/sentry-cli-Linux-x86_64
          echo "13f8cb34ae01a6a272d7d7c22e277a105286615b4020de900ea95a8de47cdbb6  $RUNNER_TEMP/sentry-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sentry-cli"
          export PATH="$RUNNER_TEMP:$PATH"
          # fail fast on a wrong token or region instead of a confusing mid-upload error
          sentry-cli info || { echo "::error::sentry-cli could not authenticate against $SENTRY_URL — check SENTRY_AUTH_TOKEN and the data region."; exit 1; }
          sentry-cli debug-files upload --include-sources build/symbols

      # App Distribution needs an APK. bundletool turns the same AAB into one universal APK
      # signed with the same key, so it is the same Shorebird release and patches reach these testers too.
      - name: Extract a universal APK for App Distribution (production)
        if: needs.resolve.outputs.is_production == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jar="$RUNNER_TEMP/bundletool.jar"
          curl -sSfL -o "$jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $jar" | sha256sum -c -
          java -jar "$jar" build-apks \
            --bundle="$ARTIFACT" \
            --output="$RUNNER_TEMP/universal.apks" \
            --mode=universal \
            --ks="${GITHUB_WORKSPACE}/android/app/release.jks" \
            --ks-pass="pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASSWORD"
          unzip -p "$RUNNER_TEMP/universal.apks" universal.apk > "build/app-${FLAVOR}-universal.apk"
          echo "DIST_ARTIFACT=build/app-${FLAVOR}-universal.apk" >> "$GITHUB_ENV"

      # service account, not `firebase login:ci`: the token login is deprecated by Firebase
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets[format('{0}_FIREBASE_APP_ID', needs.resolve.outputs.prefix)] }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          file: ${{ env.DIST_ARTIFACT || env.ARTIFACT }}
          releaseNotesFile: release-notes.txt

      - name: Upload release notes + bundle for the release job
        if: needs.resolve.outputs.is_production == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            release-notes.txt
            ${{ env.ARTIFACT }}
          retention-days: 1

      - name: Scrub secrets from the runner
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/android/app/release.jks" \
                "${GITHUB_WORKSPACE}/android/key.properties" \
                "${GITHUB_WORKSPACE}"/dart_define/*.secret.json

  release:
    name: Create GitHub Release
    # same as android, the skip of verify reaches this job through it
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.resolve.outputs.is_production == 'true' }}
    needs: [resolve, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Create the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body_path: release-notes.txt
          # download-artifact keeps the build/app/outputs/... path, so a bare `*` would miss it
          files: |
            **/*-release.aab
            **/*-release.apk
