name: Patch (hotfix)

# Ships a Dart-only fix to the PRODUCTION build in minutes, with no rebuild and no reinstall.
#
# Production only on purpose: dev and staging are plain `flutter build`, not patchable, and a
# new -dev.N / -stag.N tag already ships them in minutes.
#
# It can only patch a build deploy.yml shipped through `shorebird release`. It can't change
# native code, add a plugin with native code, or bump Flutter; Shorebird refuses those.
# The decision rule is in the hotfix skill.
#
# Manual dispatch on purpose: a patch skips the whole review-and-tag ladder, so shipping one
# must be a deliberate human action. github free + private has no required reviewers, so
# pressing "Run workflow" is the approval.

on:
  workflow_dispatch:

jobs:
  patch:
    name: Patch & publish (Android, production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLAVOR: production
      TARGET: lib/main_prod.dart
      DART_DEFINE: dart_define/prod.json
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # the patch must be built from the code that is actually live
      - name: Refuse to patch anything but production
        run: |
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" != "production" ]; then
            echo "::error::patch.yml must be run on the 'production' branch (got '$branch'). Run it from Actions -> Patch (hotfix) -> Use workflow from: production."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1.0.1
        with:
          cache: true

      - run: flutter pub get

      # same defines as the release it patches, or the patch silently turns crash reporting off
      - name: Write Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::warning::PROD_SENTRY_DSN is not set — this patch would disable crash reporting"
            printf '{}\n' > "dart_define/${FLAVOR}.secret.json"
          else
            python3 -c 'import json,os,sys; json.dump({"SENTRY_DSN": os.environ["SENTRY_DSN"]}, open(sys.argv[1],"w"))' "dart_define/${FLAVOR}.secret.json"
          fi

      # --release-version=latest builds with the exact Flutter the release used,
      # otherwise shorebird first builds with the latest stable just to find the version
      - name: Patch the most recent production release
        run: |
          shorebird patch android \
            --flavor "$FLAVOR" \
            --release-version=latest \
            -t "$TARGET" \
            --no-confirm \
            -- \
            --dart-define-from-file="$DART_DEFINE" \
            --dart-define-from-file="dart_define/${FLAVOR}.secret.json"

      - name: Scrub secrets from the runner
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}"/dart_define/*.secret.json
